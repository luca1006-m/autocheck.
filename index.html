<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>AutoCheck Cloud</title><style>
:root{--nav:#0f172a;--blue:#1677ff;--bg:#f3f6fa;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--nav);color:#fff;padding:16px;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center}.logo{font-size:26px}.brand h1{font-size:19px;margin:0}.brand p{font-size:12px;color:#cbd5e1;margin:2px 0}main{max-width:980px;margin:auto;padding:15px 15px 80px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.hidden{display:none!important}h2{font-size:18px;margin:0 0 14px}label{display:block;font-size:12px;font-weight:800;margin:9px 0 5px}input,textarea{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;font:inherit;background:#fff}textarea{min-height:75px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:750}.primary{background:var(--blue);color:#fff}.soft{background:#e8edf3}.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.muted{font-size:13px;color:var(--muted)}.notice{padding:11px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px;margin-bottom:10px}.vehicle{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.badge{font-size:11px;background:#eaf2ff;color:#1457bd;border-radius:999px;padding:4px 7px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:14px}.nav button{background:#e7ebf1}.nav .active{background:var(--nav);color:#fff}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.photo{border:1px solid var(--line);border-radius:10px;overflow:hidden}.photo img{width:100%;height:130px;object-fit:cover}.damage{border:1px solid #fecaca;background:#fffafa;border-radius:11px;padding:11px;margin:8px 0}.silhouette{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:8px}.marker circle{fill:var(--red);stroke:#fff;stroke-width:3}.marker text{fill:#fff;font-size:12px;font-weight:900;text-anchor:middle;dominant-baseline:central}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{font-size:20px;display:block}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;margin:10px 0}.success{background:#dcfce7;color:#166534;padding:10px;border-radius:10px;margin:10px 0}@media(max-width:650px){.two{grid-template-columns:1fr}.nav{overflow:auto;grid-template-columns:repeat(5,minmax(72px,1fr))}.vehicle{flex-direction:column;align-items:flex-start}.statgrid{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="brand"><div class="logo">🚗</div><div><h1>AutoCheck</h1><p>Fahrzeug-Übergabe & Schadendokumentation · <span id="status">Nicht verbunden</span></p></div></div></header><main>
<section id="login" class="card"><h2>☁️ AutoCheck verbinden</h2><div class="notice">Deine Daten werden in deinem Supabase-Projekt gespeichert. Die Zugangsdaten bleiben auf diesem Gerät.</div><label>Supabase Project URL</label><input id="url" value="https://nskguwvyysavbyjwkmez.supabase.co" placeholder="https://....supabase.co"><label>Publishable Key</label><input id="key" type="password" placeholder="sb_publishable_…"><label>Firmenname</label><input id="company" placeholder="Meine Firma"><div class="two"><div><label>E-Mail</label><input id="email" type="email" placeholder="name@firma.de"></div><div><label>Passwort</label><input id="password" type="password" placeholder="mind. 6 Zeichen"></div></div><div id="msg"></div><div class="actions"><button class="primary" onclick="signUp()">Konto + Firma erstellen</button><button class="soft" onclick="signIn()">Anmelden</button></div></section>
<section id="app" class="hidden"><nav class="nav"><button class="active" onclick="tab('home',this)">Fahrzeuge</button><button onclick="tab('handover',this)">Übergabe</button><button onclick="tab('return',this)">Rückgabe</button><button onclick="tab('damage',this)">Schäden</button><button onclick="tab('report',this)">Protokoll</button></nav>
<section id="home"><div class="card"><h2>Fahrzeug hinzufügen</h2><div class="two"><div><label>Marke & Modell</label><input id="make" placeholder="BMW 320d"></div><div><label>Kennzeichen</label><input id="plate" placeholder="AN-AB 123"></div><div><label>Kilometerstand</label><input id="km" type="number"></div><div><label>Farbe</label><input id="color" placeholder="Schwarz"></div></div><div class="actions"><button class="primary" onclick="addVehicle()">+ Fahrzeug speichern</button><button class="soft" onclick="logout()">Abmelden</button></div></div><div class="card"><h2>Meine Fahrzeuge</h2><div id="vehicles"></div></div></section>
<section id="handover" class="hidden"><div class="card"><h2>📸 Übergabe</h2><div id="hv" class="notice"></div><div class="two"><div><label>Fahrer</label><input id="driver"></div><div><label>Kilometerstand</label><input id="hkm" type="number"></div></div><label>Fotos vor der Fahrt</label><input id="before" type="file" accept="image/*" capture="environment" multiple><div id="beforeOut" class="photos"></div><label>Allgemeiner Zustand</label><textarea id="hnote"></textarea><div class="actions"><button class="primary" onclick="saveHandover()">Übergabe abschließen</button></div></div></section>
<section id="return" class="hidden"><div class="card"><h2>🔎 Rückgabe</h2><div id="rv" class="notice"></div><div class="two"><div><label>Kilometerstand</label><input id="rkm" type="number"></div><div><label>Rückgabe</label><input id="rdate" type="datetime-local"></div></div><label>Fotos bei Rückgabe</label><input id="after" type="file" accept="image/*" capture="environment" multiple><div id="afterOut" class="photos"></div><div class="actions"><button class="primary" onclick="goDamage()">Schäden erfassen →</button></div></div></section>
<section id="damage" class="hidden"><div class="card"><h2>⚠️ Schäden markieren</h2><div id="dv" class="notice"></div><div class="silhouette"><svg id="car" viewBox="0 0 800 480" width="100%"><path fill="#fff" stroke="#64748b" stroke-width="3" d="M145 120Q180 70 275 58h250q95 12 130 62l50 65q20 30 0 60l-50 115q-30 45-110 55H255q-80-10-110-55L95 245q-20-30 0-60z"/><path fill="#dbeafe" stroke="#64748b" stroke-width="2" d="M230 105Q250 78 300 72h200q50 6 70 33l-35 70H265z"/><path fill="#dbeafe" stroke="#64748b" stroke-width="2" d="M265 190h270l25 145q-20 30-55 35H295q-35-5-55-35z"/><circle fill="#1f2937" cx="120" cy="155" r="32"/><circle fill="#1f2937" cx="680" cy="155" r="32"/><circle fill="#1f2937" cx="120" cy="325" r="32"/><circle fill="#1f2937" cx="680" cy="325" r="32"/><text x="400" y="42" text-anchor="middle" fill="#64748b" font-size="16">VORNE ↑</text><g id="markers"></g></svg></div><div id="damageList"></div><div class="actions"><button class="danger" onclick="clearDamage()">Markierungen löschen</button></div></div></section>
<section id="report" class="hidden"><div class="card"><h2>📄 Protokoll</h2><div id="reportOut"></div><div class="actions"><button class="primary" onclick="window.print()">Drucken / PDF speichern</button></div></div></section></section></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
let sb=null, session=null, workspaceId=null, vehicles=[], activeId=null, handover=null, ret=null, damages=[], before=[], after=[];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,ok=false){$('msg').innerHTML=`<div class="${ok?'success':'error'}">${esc(t)}</div>`}
async function initClient(){const url=$('url').value.trim().replace(/\/$/,'');const key=$('key').value.trim();if(!url||!key)throw Error('Bitte Project URL und Publishable Key eingeben.');sb=createClient(url,key);localStorage.setItem('ac_url',url);localStorage.setItem('ac_key',key)}
async function signUp(){try{await initClient();const email=$('email').value.trim(),password=$('password').value,company=$('company').value.trim()||'Meine Firma';if(!email||password.length<6)throw Error('Bitte E-Mail und Passwort eingeben (mind. 6 Zeichen).');const {data,error}=await sb.auth.signUp({email,password});if(error)throw error;if(!data.session){msg('Konto erstellt. Bitte bestätige zuerst die E-Mail. Danach hier mit „Anmelden“ einloggen.',true);return}await createWorkspace(company)}catch(e){msg(e.message||String(e))}}
async function signIn(){try{await initClient();const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;session=data.session;await ensureWorkspace($('company').value.trim()||'Meine Firma');openApp()}catch(e){msg(e.message||String(e))}}
async function createWorkspace(name){const {data,error}=await sb.rpc('create_autocheck_workspace',{workspace_name:name});if(error)throw error;workspaceId=data;session=(await sb.auth.getSession()).data.session;openApp()}
async function ensureWorkspace(name){const u=(await sb.auth.getUser()).data.user;const {data,error}=await sb.from('workspace_members').select('workspace_id').eq('user_id',u.id).limit(1).maybeSingle();if(error)throw error;if(data)workspaceId=data.workspace_id;else await createWorkspace(name)}
async function openApp(){session=(await sb.auth.getSession()).data.session;if(!session)throw Error('Keine Anmeldung vorhanden.');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('status').textContent='Cloud verbunden';await loadVehicles()}
async function loadVehicles(){const {data,error}=await sb.from('vehicles').select('*').eq('workspace_id',workspaceId).order('created_at');if(error)throw error;vehicles=data||[];activeId=activeId||vehicles[0]?.id||null;await refresh();render()}
function active(){return vehicles.find(v=>Number(v.id)===Number(activeId))}
async function refresh(){const v=active();if(!v){handover=ret=null;damages=[];return}let q=await sb.from('handovers').select('*').eq('workspace_id',workspaceId).eq('vehicle_id',v.id).order('date',{ascending:false}).limit(1);handover=q.data?.[0]||null;q=await sb.from('returns').select('*').eq('workspace_id',workspaceId).eq('vehicle_id',v.id).order('date',{ascending:false}).limit(1);ret=q.data?.[0]||null;q=await sb.from('damages').select('*').eq('workspace_id',workspaceId).eq('vehicle_id',v.id).order('id');damages=q.data||[]}
async function addVehicle(){try{const v={id:Date.now(),workspace_id:workspaceId,make:$('make').value.trim(),plate:$('plate').value.trim(),km:$('km').value,color:$('color').value.trim(),created_at:new Date().toISOString()};if(!v.make||!v.plate)throw Error('Marke/Modell und Kennzeichen eingeben.');const {error}=await sb.from('vehicles').insert(v);if(error)throw error;vehicles.push(v);activeId=v.id;['make','plate','km','color'].forEach(x=>$(x).value='');await refresh();render()}catch(e){alert(e.message)}}
async function delVehicle(id){if(!confirm('Fahrzeug wirklich löschen?'))return;const {error}=await sb.from('vehicles').delete().eq('workspace_id',workspaceId).eq('id',id);if(error)return alert(error.message);vehicles=vehicles.filter(v=>v.id!==id);activeId=vehicles[0]?.id||null;await refresh();render()}
async function selectVehicle(id){activeId=id;await refresh();render()}
function files(input,setter,out){input.addEventListener('change',async()=>{const arr=[];for(const f of input.files){arr.push({name:f.name,data:await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})})}setter(arr);out.innerHTML=arr.map(p=>`<div class="photo"><img src="${p.data}"><small>${esc(p.name)}</small></div>`).join('')})}
async function saveHandover(){const v=active();if(!v)return alert('Bitte Fahrzeug auswählen.');if(!$('driver').value.trim())return alert('Bitte Fahrer eingeben.');const {data,error}=await sb.from('handovers').insert({workspace_id:workspaceId,vehicle_id:v.id,driver:$('driver').value.trim(),km:$('hkm').value,date:new Date().toISOString(),note:$('hnote').value}).select().single();if(error)return alert(error.message);for(const p of before){const path=`${workspaceId}/${v.id}/handover/${Date.now()}-${p.name}`;const raw=await fetch(p.data).then(r=>r.blob());const up=await sb.storage.from('autocheck-photos').upload(path,raw,{upsert:true});if(!up.error)await sb.from('photos').insert({workspace_id:workspaceId,vehicle_id:v.id,handover_id:data.id,return_id:null,kind:'handover',name:p.name,storage_path:path,created_at:new Date().toISOString()})}before=[];await refresh();render();alert('Übergabe gespeichert.')}
async function goDamage(){const v=active();if(!v)return alert('Bitte Fahrzeug auswählen.');const {data,error}=await sb.from('returns').insert({workspace_id:workspaceId,vehicle_id:v.id,km:$('rkm').value,date:$('rdate').value?new Date($('rdate').value).toISOString():new Date().toISOString()}).select().single();if(error)return alert(error.message);ret=data;for(const p of after){const path=`${workspaceId}/${v.id}/return/${Date.now()}-${p.name}`;const raw=await fetch(p.data).then(r=>r.blob());const up=await sb.storage.from('autocheck-photos').upload(path,raw,{upsert:true});if(!up.error)await sb.from('photos').insert({workspace_id:workspaceId,vehicle_id:v.id,handover_id:null,return_id:data.id,kind:'return',name:p.name,storage_path:path,created_at:new Date().toISOString()})}after=[];await refresh();tab('damage',document.querySelectorAll('.nav button')[3])}
const spots=[['Vorne links',175,130],['Vorne rechts',625,130],['Hinten links',175,345],['Hinten rechts',625,345],['Fahrertür',250,250],['Beifahrertür',550,250],['Motorhaube',400,105],['Kofferraum',400,375],['Felge vorne links',115,155],['Felge vorne rechts',685,155],['Felge hinten links',115,325],['Felge hinten rechts',685,325]];
$('car').addEventListener('click',async e=>{if(e.target.closest('.marker'))return;const svg=$('car'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());const s=spots.reduce((a,x)=>Math.hypot(x[1]-p.x,x[2]-p.y)<Math.hypot(a[1]-p.x,a[2]-p.y)?x:a);if(Math.hypot(s[1]-p.x,s[2]-p.y)>80)return;const desc=prompt('Beschreibung an '+s[0]+':','Kratzer, Delle, Lackschaden');if(desc===null)return;const {error}=await sb.from('damages').insert({workspace_id:workspaceId,vehicle_id:active().id,return_id:ret?.id||null,x:s[1],y:s[2],position:s[0],existing:false,description:desc.trim()||'Nicht näher beschrieben',created_at:new Date().toISOString()});if(error)alert(error.message);else{await refresh();render()}});
async function clearDamage(){if(!active())return;const {error}=await sb.from('damages').delete().eq('workspace_id',workspaceId).eq('vehicle_id',active().id);if(error)alert(error.message);else{await refresh();render()}}
function draw(){ $('markers').innerHTML=damages.map((d,i)=>`<g class="marker"><circle cx="${d.x}" cy="${d.y}" r="15"></circle><text x="${d.x}" y="${d.y}">${i+1}</text></g>`).join('') }
function render(){const v=active();$('vehicles').innerHTML=vehicles.length?vehicles.map(x=>`<div class="vehicle"><div><b>${esc(x.make)}</b> <span class="badge">${esc(x.plate)}</span><div class="muted">${esc(x.color||'')} · ${esc(x.km||'-')} km</div></div><div class="actions"><button class="soft" onclick="selectVehicle(${x.id})">${Number(x.id)===Number(activeId)?'✓ ausgewählt':'Auswählen'}</button><button class="danger" onclick="delVehicle(${x.id})">Löschen</button></div></div>`).join(''):'<p class="muted">Noch kein Fahrzeug angelegt.</p>';const l=v?`<b>${esc(v.make)}</b> · ${esc(v.plate)}`:'Bitte zuerst ein Fahrzeug auswählen.';$('hv').innerHTML=l;$('rv').innerHTML=l;$('dv').innerHTML=l;draw();$('damageList').innerHTML=damages.length?damages.map((d,i)=>`<div class="damage"><b>⚠ ${i+1}. ${esc(d.position)}</b><br>${esc(d.description)}</div>`).join(''):'<p class="muted">Noch keine Markierungen.</p>';report()}
async function report(){const v=active();if(!v){$('reportOut').innerHTML='<p class="muted">Kein Fahrzeug ausgewählt.</p>';return}$('reportOut').innerHTML=`<h3>${esc(v.make)} · ${esc(v.plate)}</h3><div class="statgrid"><div class="stat"><span class="muted">Ausgangs-KM</span><b>${esc(v.km||'-')}</b></div><div class="stat"><span class="muted">Übergabe-KM</span><b>${esc(handover?.km||'-')}</b></div><div class="stat"><span class="muted">Rückgabe-KM</span><b>${esc(ret?.km||'-')}</b></div></div>${handover?`<h3>Übergabe</h3><p>Fahrer: <b>${esc(handover.driver)}</b></p><p>${esc(handover.note||'')}</p>`:'<div class="notice">Noch keine Übergabe.</div>'}${ret?`<h3>Rückgabe</h3><p>${new Date(ret.date).toLocaleString('de-DE')}</p><h3>Schäden</h3>${damages.length?damages.map((d,i)=>`<div class="damage"><b>⚠ ${i+1}. ${esc(d.position)}</b><br>${esc(d.description)}</div>`).join(''):'Keine Schäden dokumentiert.'}`:'<div class="notice">Noch keine Rückgabe.</div>'}`}
function tab(id,btn){document.querySelectorAll('#app>section').forEach(s=>s.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}
async function logout(){await sb?.auth.signOut();location.reload()}
files($('before'),x=>before=x,$('beforeOut'));files($('after'),x=>after=x,$('afterOut'));
for(const [id,key] of [['url','ac_url'],['key','ac_key']]){const v=localStorage.getItem(key);if(v)$(id).value=v}
$('key').value=localStorage.getItem('ac_key')||'';
if(localStorage.getItem('ac_url')&&localStorage.getItem('ac_key')){try{await initClient();const s=(await sb.auth.getSession()).data.session;if(s){session=s;await ensureWorkspace(localStorage.getItem('ac_company')||'Meine Firma');await openApp()}}catch(e){console.warn(e)}}
$('company').addEventListener('change',()=>localStorage.setItem('ac_company',$('company').value));
window.signUp=signUp;window.signIn=signIn;window.addVehicle=addVehicle;window.delVehicle=delVehicle;window.selectVehicle=selectVehicle;window.saveHandover=saveHandover;window.goDamage=goDamage;window.clearDamage=clearDamage;window.tab=tab;window.logout=logout;
</script></body></html>
